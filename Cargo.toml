[workspace]
members = [
    "crates/mi2play-core",
    "crates/mi2play-miplay",
    "crates/mi2play-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
mi2play-core = { path = "crates/mi2play-core" }
mi2play-miplay = { path = "crates/mi2play-miplay" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
