name: Build binaries

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: windows-x86
            runner: windows-2022
            target: i686-pc-windows-msvc
            archive: zip
          - name: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: linux-x86
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-arm
            runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
            cross: true
          - name: linux-aarch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.target }}" -p mi2play-cli
          else
            cargo build --release --locked --target "${{ matrix.target }}" -p mi2play-cli
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="dist/mi2play-${{ matrix.name }}"
          mkdir -p "$staging"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/mi2play.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/mi2play" "$staging/"
          fi
          cp README.md "$staging/"
          cp LICENSE* "$staging/" 2>/dev/null || true
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${staging}.zip" "$staging" >/dev/null
          else
            tar -C dist -czf "${staging}.tar.gz" "$(basename "$staging")"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi2play-${{ matrix.name }}
          path: dist/mi2play-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error
